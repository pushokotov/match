name: Go CI

on:
  push:
    branches: [go-rewrite]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
